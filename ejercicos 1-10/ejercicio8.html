<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueldo vendedor con formulario</title>
</head>

<body>

    <table>
        <tr>
            <td>
                Nombre del vendedor
            </td>
        </tr>

        <tr>
            <td>
                <input type="text" id="txt-nombre" placeholder="Ingrese nombre">
            </td>
        </tr>

        <tr>
            <td>
                Sueldo básico
            </td>
        </tr>

        <tr>
            <td>
                <input type="number" id="txt-sueldo" placeholder="Ingrese sueldo">
            </td>
        </tr>

        <tr>
            <td>
                Venta 1
            </td>
        </tr>

        <tr>
            <td>
                <input type="number" id="txt-venta1" placeholder="Ingrese venta 1">
            </td>
        </tr>

        <tr>
            <td>
                Venta 2
            </td>
        </tr>

        <tr>
            <td>
                <input type="number" id="txt-venta2" placeholder="Ingrese venta 2">
            </td>
        </tr>

        <tr>
            <td>
                Venta 3
            </td>
        </tr>

        <tr>
            <td>
                <input type="number" id="txt-venta3" placeholder="Ingrese venta 3">
            </td>
        </tr>

        <tr>
            <td>
                <button id="btn-verificar">Calcular sueldo</button>
            </td>
        </tr>

        <tr>
            <td>
                <p id="resultado"></p>
            </td>
        </tr>
    </table>


    <script>

        const txtnombre = document.getElementById("txt-nombre");
        const txtsueldo = document.getElementById("txt-sueldo");
        const txtventa1 = document.getElementById("txt-venta1");
        const txtventa2 = document.getElementById("txt-venta2");
        const txtventa3 = document.getElementById("txt-venta3");
        const btnverificar = document.getElementById("btn-verificar");
        const resultado = document.getElementById("resultado");


        btnverificar.addEventListener("click", function() {

            let nombre = txtnombre.value;
            let sueldo = parseFloat(txtsueldo.value);

            let ventas = [
                parseFloat(txtventa1.value),
                parseFloat(txtventa2.value),
                parseFloat(txtventa3.value)
            ];

            let totalVentas = 0;

            // FOR para sumar las 3 ventas
            for (let i = 0; i < 3; i++) {
                totalVentas = totalVentas + ventas[i];
            }

            // Calcular el 10% de comisión
            let comision = totalVentas * 0.10;

            // Calcular sueldo total
            let sueldoTotal = sueldo + comision;

            resultado.innerHTML =
                "Vendedor: " + nombre + "<br>" +
                "Total de ventas: $" + totalVentas.toFixed(2) + "<br>" +
                "Total de comisiones: $" + comision.toFixed(2) + "<br>" +
                "Sueldo total a recibir: $" + sueldoTotal.toFixed(2);

        });

    </script>

</body>
</html>
