<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Fibonacci y Primos</title>
</head>

<body>

    <h1>Fibonacci y Números Primos</h1>

    <form id="formulario">

        <label for="numero">
            Ingrese la cantidad de números Fibonacci:
        </label>

        <input type="number" id="numero" min="1" required>

        <br><br>

        <button type="submit">
            Generar Fibonacci
        </button>

    </form>

    <br>

    <div id="resultado"></div>

    <script>

        document.getElementById("formulario").addEventListener("submit", function(event) {

            event.preventDefault();

            let N = Number(document.getElementById("numero").value);
            let a = 1;
            let b = 1;
            let fibonacci = "";
            let cantidadPrimos = 0;

            for (let i = 1; i <= N; i++) {
                let numero = a;
                fibonacci += numero + " ";
                let esPrimo = true;
                if (numero < 2) {
                    esPrimo = false;
                } 
                else {
                    for (let j = 2; j < numero; j++) {

                        if (numero % j === 0) {
                            esPrimo = false;
                            break;
                        }
                    }
                }
                if (esPrimo) {
                    cantidadPrimos++;
                }
                let siguiente = a + b;
                a = b;
                b = siguiente;
            }
            document.getElementById("resultado").innerHTML =
                "<h3>Números de Fibonacci:</h3>" +
                fibonacci +
                "<br><br>" +
                "<strong>Cantidad de números primos: </strong>" +
                cantidadPrimos;

        });

    </script>

</body>
</html>
