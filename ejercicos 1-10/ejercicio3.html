<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Factorial</title>
</head>

<body>

    <h1>Calcular Factorial</h1>

    <form id="formulario">

        <label for="numero">
            Ingrese un número:
        </label>

        <input type="number" id="numero" min="0" required>

        <button type="submit">
            Calcular Factorial
        </button>

    </form>

    <br>

    <div id="resultado"></div>

    <script>

        document.getElementById("formulario").addEventListener("submit", function (event) {

            event.preventDefault();

            let N = Number(document.getElementById("numero").value);

            let factorial = 1;

            for (let i = 1; i <= N; i++) {

                factorial = factorial * i;

            }

            document.getElementById("resultado").innerHTML =
                "<h3>Resultado:</h3>" +
                N + "! = " + factorial;

        });

    </script>

</body>

</html>
